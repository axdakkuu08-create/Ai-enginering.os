name: Step B.1 Quality Checks

on:
  push:
    branches:
      - feat/projects-registry
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "packages/**"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/step-b1-quality.yml"

permissions:
  contents: read

concurrency:
  group: step-b1-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Step B.1 Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify committed lockfile
        run: |
          set -euo pipefail
          test -f package-lock.json
          echo "Committed package-lock.json is present."
          echo "Workflow has contents: read only; no write token is exposed to build steps."

      - name: Clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Generate verification evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/step-b1-evidence"
          report="$RUNNER_TEMP/step-b1-evidence/step-b1-verification.md"
          {
            echo "# Step B.1 Quality Verification"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Exact tested commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Node: $(node --version)"
            echo "- npm: $(npm --version)"
            echo "- Token permissions: contents: read"
            echo "- Checkout credential persistence: disabled"
            echo "- Dependency lifecycle scripts: disabled for npm ci"
            echo
            echo "The workflow does not write commits, push branches, merge, or deploy."
            echo "This report records CI outcomes only and does not authorize Step C."
          } > "$report"
          cat "$report"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-b1-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/step-b1-evidence/
          if-no-files-found: warn
          retention-days: 14
