name: Auth0 Security Foundation Checks

on:
  push:
    branches:
      - feat/auth0-backend-security-foundation
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "packages/**"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/auth0-security-foundation.yml"

permissions:
  contents: read

concurrency:
  group: auth0-security-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Auth0 Security Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install committed dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint for changed security files
        run: npx eslint packages/core/src/security/auth0-access-token-verifier.ts packages/core/tests/auth0-access-token-verifier.test.ts

      - name: Prettier check
        run: npx prettier --check packages/core/src/security/auth0-access-token-verifier.ts packages/core/tests/auth0-access-token-verifier.test.ts packages/core/README.md .github/workflows/auth0-security-foundation.yml

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Record exact tested revision
        if: always()
        run: |
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Exact tested commit: $GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Token permissions: contents: read"
            echo "Checkout credential persistence: disabled"
            echo "Dependency lifecycle scripts: disabled"
            echo "No secrets are required or exposed to this workflow."
            echo "This workflow does not deploy, merge, or authorize OS-10.3."
          } > "$RUNNER_TEMP/auth0-security-foundation.txt"
          cat "$RUNNER_TEMP/auth0-security-foundation.txt"
