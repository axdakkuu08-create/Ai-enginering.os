name: OS-10.3 Candidate Formatting Output

on:
  pull_request:
    paths:
      - "packages/core/src/permissions/**"
      - "packages/core/src/security/**"
      - "packages/core/src/types/**"
      - "packages/core/tests/**"
      - ".github/workflows/os103-formatting-output.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  format:
    name: Generate canonical Prettier output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format affected files
        run: |
          set -euo pipefail
          npx prettier --write \
            packages/core/src/permissions/engine.ts \
            packages/core/src/permissions/index.ts \
            packages/core/src/permissions/store.ts \
            packages/core/src/permissions/types.ts \
            packages/core/src/security/approval-store.ts \
            packages/core/src/security/postgres-stores.ts \
            packages/core/src/security/protected-action.ts \
            packages/core/src/types/index.ts \
            packages/core/tests/approval-store.test.ts \
            packages/core/tests/audit-ledger.test.ts \
            packages/core/tests/auth0-access-token-verifier.test.ts \
            packages/core/tests/human-authorization.test.ts \
            packages/core/tests/permissions/engine.test.ts \
            packages/core/tests/postgres-stores.test.ts \
            packages/core/tests/protected-action.test.ts
          mkdir -p "$RUNNER_TEMP/os103-formatted"
          for file in \
            packages/core/src/permissions/engine.ts \
            packages/core/src/permissions/index.ts \
            packages/core/src/permissions/store.ts \
            packages/core/src/permissions/types.ts \
            packages/core/src/security/approval-store.ts \
            packages/core/src/security/postgres-stores.ts \
            packages/core/src/security/protected-action.ts \
            packages/core/src/types/index.ts \
            packages/core/tests/approval-store.test.ts \
            packages/core/tests/audit-ledger.test.ts \
            packages/core/tests/auth0-access-token-verifier.test.ts \
            packages/core/tests/human-authorization.test.ts \
            packages/core/tests/permissions/engine.test.ts \
            packages/core/tests/postgres-stores.test.ts \
            packages/core/tests/protected-action.test.ts
          do
            mkdir -p "$RUNNER_TEMP/os103-formatted/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/os103-formatted/$file"
          done
          npx prettier --check \
            packages/core/src/permissions/engine.ts \
            packages/core/src/permissions/index.ts \
            packages/core/src/permissions/store.ts \
            packages/core/src/permissions/types.ts \
            packages/core/src/security/approval-store.ts \
            packages/core/src/security/postgres-stores.ts \
            packages/core/src/security/protected-action.ts \
            packages/core/src/types/index.ts \
            packages/core/tests/approval-store.test.ts \
            packages/core/tests/audit-ledger.test.ts \
            packages/core/tests/auth0-access-token-verifier.test.ts \
            packages/core/tests/human-authorization.test.ts \
            packages/core/tests/permissions/engine.test.ts \
            packages/core/tests/postgres-stores.test.ts \
            packages/core/tests/protected-action.test.ts

      - name: Upload formatted source files
        uses: actions/upload-artifact@v4
        with:
          name: os103-formatted-files-${{ github.run_id }}
          path: ${{ runner.temp }}/os103-formatted/
          if-no-files-found: error
          retention-days: 7
