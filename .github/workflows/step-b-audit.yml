name: Step B Core Scaffold Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/projects-registry
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "packages/core/**"
      - ".github/workflows/step-b-audit.yml"

permissions:
  contents: read

concurrency:
  group: step-b-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Step B Core Scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize audit evidence
        id: init
        run: |
          set -euo pipefail
          LOG_DIR="$RUNNER_TEMP/step-b-audit"
          mkdir -p "$LOG_DIR"
          echo "log_dir=$LOG_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "STEP B CORE SCAFFOLD AUDIT"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Ref: $GITHUB_REF"
            echo "Ref name: $GITHUB_REF_NAME"
            echo "Commit SHA: $(git rev-parse HEAD)"
            echo "Expected baseline SHA: 70eebfe72a573145f114d99a6c3b9270ecd50357"
            echo "UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Initial tracked changes:"
            git diff --name-status
            echo "Initial untracked files:"
            git ls-files --others --exclude-standard | grep -v '^node_modules/' || true
          } | tee "$LOG_DIR/test_execution_audit.log"
          if [[ "$GITHUB_REF_NAME" != "feat/projects-registry" ]]; then
            echo "ERROR: Audit must run on feat/projects-registry."
            exit 1
          fi

      - name: Generate lockfile if absent and install dependencies
        id: install
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG_DIR="${{ steps.init.outputs.log_dir }}"
          {
            echo "=== DEPENDENCY INSTALLATION ==="
            if [[ ! -f package-lock.json ]]; then
              echo "No committed package-lock.json exists."
              echo "Generating runner-local lockfile from package.json for this audit."
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              LOCK_GENERATION_EXIT=$?
              echo "Lock generation exit code: $LOCK_GENERATION_EXIT"
              if [[ "$LOCK_GENERATION_EXIT" -ne 0 ]]; then
                echo "INSTALL_EXIT_CODE=$LOCK_GENERATION_EXIT" >> "$GITHUB_ENV"
                exit "$LOCK_GENERATION_EXIT"
              fi
            else
              echo "Committed package-lock.json found."
            fi
            npm ci --no-audit --no-fund
            INSTALL_EXIT=$?
            echo "Dependency installation exit code: $INSTALL_EXIT"
            echo "INSTALL_EXIT_CODE=$INSTALL_EXIT" >> "$GITHUB_ENV"
            npx --no-install vitest --version
            npx --no-install tsc --version
            exit "$INSTALL_EXIT"
          } 2>&1 | tee "$LOG_DIR/dependency-install.log"
          exit "${PIPESTATUS[0]}"

      - name: Execute Step B Vitest tests
        id: vitest
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG_DIR="${{ steps.init.outputs.log_dir }}"
          npx vitest run packages/core/tests/approval.test.ts --reporter=verbose 2>&1 | tee "$LOG_DIR/vitest-output.log"
          TEST_EXIT="${PIPESTATUS[0]}"
          echo "VITEST_EXIT_CODE=$TEST_EXIT" >> "$GITHUB_ENV"
          exit "$TEST_EXIT"

      - name: Execute TypeScript verification
        id: typescript
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          LOG_DIR="${{ steps.init.outputs.log_dir }}"
          npx tsc --noEmit 2>&1 | tee "$LOG_DIR/typescript-output.log"
          TSC_EXIT="${PIPESTATUS[0]}"
          echo "TSC_EXIT_CODE=$TSC_EXIT" >> "$GITHUB_ENV"
          exit "$TSC_EXIT"

      - name: Generate audit report
        if: always()
        run: |
          set -uo pipefail
          LOG_DIR="${{ steps.init.outputs.log_dir }}"
          REPORT="$LOG_DIR/step-b-audit-report.md"
          INSTALL_RESULT="${INSTALL_EXIT_CODE:-not-run}"
          VITEST_RESULT="${VITEST_EXIT_CODE:-not-run}"
          TSC_RESULT="${TSC_EXIT_CODE:-not-run}"
          TEST_FILE_DISCOVERED="NOT VERIFIED"
          TEST_SUMMARY="NOT VERIFIED"
          if [[ -f "$LOG_DIR/vitest-output.log" ]]; then
            sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$LOG_DIR/vitest-output.log" > "$LOG_DIR/vitest-output-clean.log"
            if grep -Eq 'Test Files[[:space:]]+[0-9]+ (passed|failed|skipped)' "$LOG_DIR/vitest-output-clean.log"; then
              TEST_FILE_DISCOVERED="SUMMARY PRESENT"
            fi
            TEST_SUMMARY="$(grep -E '^[[:space:]]*Tests[[:space:]]+' "$LOG_DIR/vitest-output-clean.log" | tail -n 1 || true)"
            [[ -n "$TEST_SUMMARY" ]] || TEST_SUMMARY="No recognizable Vitest test summary; manual review required"
          fi
          if [[ -f package-lock.json ]] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            LOCK_STATUS="Runner-generated lockfile; not yet committed"
          elif [[ -f package-lock.json ]]; then
            LOCK_STATUS="Committed lockfile used"
          else
            LOCK_STATUS="Lockfile unavailable"
          fi
          AUDIT_STATUS="REVIEW REQUIRED — evidence incomplete"
          if [[ "$INSTALL_RESULT" != "not-run" && "$INSTALL_RESULT" != "0" ]]; then
            AUDIT_STATUS="FAIL — dependency installation failed"
          elif [[ "$INSTALL_RESULT" == "0" && "$VITEST_RESULT" == "0" && "$TSC_RESULT" == "0" && "$TEST_FILE_DISCOVERED" == "SUMMARY PRESENT" ]]; then
            AUDIT_STATUS="PASS — automated checks passed; human review still required"
          elif [[ "$INSTALL_RESULT" == "0" && ( "$VITEST_RESULT" != "0" || "$TSC_RESULT" != "0" ) ]]; then
            AUDIT_STATUS="FAIL — one or more required checks failed"
          fi
          {
            echo "# Step B Core Scaffold Audit Report"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Ref: $GITHUB_REF"
            echo "- Commit tested: $(git rev-parse HEAD)"
            echo "- Expected baseline: 70eebfe72a573145f114d99a6c3b9270ecd50357"
            echo "- Run ID / attempt: $GITHUB_RUN_ID / $GITHUB_RUN_ATTEMPT"
            echo "- UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Node: $(node --version); npm: $(npm --version)"
            echo "- Lockfile status: $LOCK_STATUS"
            echo "- Dependency installation exit: $INSTALL_RESULT"
            echo "- Vitest exit: $VITEST_RESULT"
            echo "- TypeScript exit: $TSC_RESULT"
            echo "- Test-file summary: $TEST_FILE_DISCOVERED"
            echo "- Vitest test summary: $TEST_SUMMARY"
            echo
            echo "## Working-tree status"
            echo "Tracked changes:"
            git diff --name-status
            echo
            echo "Untracked files:"
            git ls-files --others --exclude-standard | grep -v '^node_modules/' || true
            echo
            echo "## Final audit status"
            echo "$AUDIT_STATUS"
            echo
            echo "This automated report does not verify a separate Codespace working tree, Android runtime, production deployment, or authorize merge/release."
          } > "$REPORT"
          cat "$REPORT"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-b-audit-${{ github.run_id }}
          path: |
            ${{ steps.init.outputs.log_dir }}/
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
