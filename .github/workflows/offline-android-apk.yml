name: OS-10.3 Offline Android APK
on:
  workflow_dispatch:
  push:
    branches: [feat/os103-offline-android-review]
    paths: ["app/**", "*.gradle.kts", "settings.gradle.kts", ".github/workflows/offline-android-apk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and network permissions
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          if grep -R --include='AndroidManifest.xml' -E 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE' app/src/main; then
            echo "Unexpected network permission in source manifest" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aios-os103-offline-review-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14