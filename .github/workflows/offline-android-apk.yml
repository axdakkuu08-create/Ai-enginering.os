name: OS-10.3 Offline Android APK
on:
  workflow_dispatch:
  push:
    branches: [feat/os103-offline-android-review]
    paths: ["app/**", "*.gradle.kts", "settings.gradle.kts", ".github/workflows/offline-android-apk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK and install required packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Validate offline UI script
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one packaged script block")
          Path("/tmp/offline-ui.js").write_text(scripts[0])
          PY
          node --check /tmp/offline-ui.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify packaged APK and offline boundary
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          if grep -E 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' /tmp/apk-permissions.txt; then
            echo "Unexpected network permission in packaged APK" >&2
            exit 1
          fi
          if grep -E '(src|href)="https?://' app/src/main/assets/index.html; then
            echo "Unexpected remote asset reference in offline UI" >&2
            exit 1
          fi
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aios-os103-offline-review-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14