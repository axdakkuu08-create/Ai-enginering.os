name: One-time package lockfile bootstrap

on:
  push:
    branches:
      - feat/projects-registry
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-lockfile-feat-projects-registry
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feat/projects-registry
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate and commit package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "package-lock.json already exists; refusing to overwrite it."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.name!=='ai-engineering-os' || p.lockfileVersion!==3) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:feat/projects-registry
